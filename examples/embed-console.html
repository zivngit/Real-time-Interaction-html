<!DOCTYPE html>

<body>

<p>這是宿主網頁的內容。console 依序載入 <code>/console/style.css</code>、<code>/console/icons.js</code>、<code>/console/app.js</code>，載入後右下角出現 FAB，可發送特效至所有 viewer。</p>
<button type="button">宿主按鈕（示範）</button>
<ul>
  <li>宿主內容項目一</li>
  <li>宿主內容項目二</li>
</ul>
<link rel="stylesheet" href="/console/style.css">
<script src="/console/icons.js"></script>
<!-- 若 server 有設定 ACCESS_KEY 環境變數，請將下方 data-key 填入對應金鑰；未設定則留空 -->
<script src="/console/app.js" data-key=""></script>
