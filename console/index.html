<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>console — 控制端</title>
<style>
  html, body { margin: 0; height: 100%; background: #101418; overflow: hidden; font-family: system-ui, sans-serif; }
  #fab {
    position: fixed; left: 12px; top: 12px; z-index: 12;
    width: 44px; height: 44px; border-radius: 50%;
    background: #2d4a66; border: 1px solid #6ea3d8;
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
    cursor: grab; display: flex; align-items: center; justify-content: center;
    padding: 0; touch-action: none;
  }
  #fab:hover { background: #35597a; }
  #fab.dragging { cursor: grabbing; }
  #fab svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2; stroke-linecap: round; fill: none; }
  #fab .icon-close { display: none; }
  #fab.active .icon-open { display: none; }
  #fab.active .icon-close { display: block; }
  #panel {
    position: fixed; left: 12px; top: 66px; z-index: 11;
    background: rgba(20, 26, 32, 0.92); color: #dfe7ee;
    border: 1px solid #2c3a46; border-radius: 10px; padding: 12px 14px;
    width: 280px; box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    user-select: none;
    opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  #panel.open { opacity: 1; transform: none; pointer-events: auto; }
  #panel h1 { font-size: 13px; margin: 0 0 10px; color: #8fb6d9; letter-spacing: 1px; }
  .fxGroup { margin-bottom: 8px; }
  .fxGroupTitle { font-size: 11px; color: #64798a; letter-spacing: 1px; margin-bottom: 4px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  /* 統一圓形圖示按鈕（參考 #fab）：特效按鈕較大為主視覺，動作按鈕較小次要 */
  .fx {
    width: 52px; height: 52px; border-radius: 50%; padding: 0;
    background: #1b2530; border: 1px solid #33475a;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .fx svg { width: 26px; height: 26px; stroke: #dfe7ee; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .fx:hover { border-color: #4d6a86; background: #22303d; }
  .fx.selected { background: #2d4a66; border-color: #6ea3d8; }
  .fx.selected svg { stroke: #fff; }
  .actionBtn {
    width: 34px; height: 34px; border-radius: 50%; padding: 0;
    background: #1b2530; border: 1px solid #33475a;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .actionBtn svg { width: 17px; height: 17px; stroke: #9fb4c6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .actionBtn:hover { border-color: #4d6a86; background: #22303d; }
  .actionBtn.active { background: #2d4a66; border-color: #6ea3d8; }
  .actionBtn.active svg { stroke: #fff; }
  #clearBtn {
    width: 34px; height: 34px; border-radius: 50%; padding: 0;
    background: #3a2026; border: 1px solid #6e3a44;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  #clearBtn svg { width: 17px; height: 17px; stroke: #ff9b9b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  #clearBtn:hover { background: #4a2830; }
  .collapsible { display: none; margin-top: 4px; padding-top: 8px; border-top: 1px solid #2c3a46; }
  .collapsible.open { display: block; }
  .field { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 6px; }
  .field label { width: 52px; color: #8fa6b8; }
  .field input[type="color"] { width: 34px; height: 24px; border: none; background: none; padding: 0; cursor: pointer; }
  .field input[type="text"], .field input[type="number"] { flex: 1; background: #101820; color: #dfe7ee; border: 1px solid #33475a; border-radius: 4px; padding: 4px 6px; font-size: 12px; }
  .field input[type="url"], .field input[type="password"] { flex: 1; background: #101820; color: #dfe7ee; border: 1px solid #33475a; border-radius: 4px; padding: 4px 6px; font-size: 11px; }
  #hint { font-size: 11px; color: #64798a; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>
<button id="fab" aria-expanded="false" aria-controls="panel" title="展開/收合控制台">
  <svg class="icon-open" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="12" r="2.2"/><circle cx="7" cy="17" r="2.2"/></svg>
  <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
</button>
<div id="panel">
  <h1>控制端 (console)</h1>
    <div id="fxButtons">
      <div class="fxGroup">
        <div class="fxGroupTitle">爆散</div>
        <div class="row">
          <button class="fx selected" data-fx="particle" title="粒子爆散" aria-label="粒子爆散">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.4"/><line x1="12" y1="3" x2="12" y2="7"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="3" y1="12" x2="7" y2="12"/><line x1="17" y1="12" x2="21" y2="12"/><line x1="5.6" y1="5.6" x2="8" y2="8"/><line x1="16" y1="16" x2="18.4" y2="18.4"/><line x1="18.4" y1="5.6" x2="16" y2="8"/><line x1="8" y1="16" x2="5.6" y2="18.4"/></svg>
          </button>
          <button class="fx" data-fx="firework" title="煙火" aria-label="煙火">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="12" x2="4" y2="6"/><line x1="12" y1="12" x2="20" y2="6"/><line x1="12" y1="12" x2="12" y2="4"/><line x1="12" y1="12" x2="7" y2="5"/><line x1="12" y1="12" x2="17" y2="5"/></svg>
          </button>
        </div>
      </div>
      <div class="fxGroup">
        <div class="fxGroupTitle">漣漪</div>
        <div class="row">
          <button class="fx" data-fx="ripple" title="漣漪圈" aria-label="漣漪圈">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="10"/></svg>
          </button>
        </div>
      </div>
      <div class="fxGroup">
        <div class="fxGroupTitle">文字</div>
        <div class="row">
          <button class="fx" data-fx="text" title="浮現文字" aria-label="浮現文字">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="6" x2="19" y2="6"/><line x1="12" y1="6" x2="12" y2="19"/><line x1="9" y1="19" x2="15" y2="19"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="row">
      <button id="paramsBtn" class="actionBtn" aria-expanded="false" aria-controls="paramsPanel" title="參數" aria-label="參數">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="9" cy="8" r="2.2"/><circle cx="15" cy="16" r="2.2"/></svg>
      </button>
      <button id="connBtn" class="actionBtn" aria-expanded="false" aria-controls="connPanel" title="連線設定" aria-label="連線設定">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="6" rx="1.5"/><rect x="4" y="13" width="16" height="6" rx="1.5"/><circle cx="8" cy="8" r="1"/><circle cx="8" cy="16" r="1"/></svg>
      </button>
      <button id="clearBtn" title="清屏" aria-label="清屏">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="7" x2="19" y2="7"/><line x1="9" y1="7" x2="9" y2="5"/><line x1="15" y1="7" x2="15" y2="5"/><line x1="9" y1="5" x2="15" y2="5"/><line x1="6" y1="7" x2="7" y2="19"/><line x1="18" y1="7" x2="17" y2="19"/><line x1="7" y1="19" x2="17" y2="19"/></svg>
      </button>
    </div>
  <div id="paramsPanel" class="collapsible">
    <div id="paramsBody"></div>
  </div>
  <div id="connPanel" class="collapsible">
    <div class="field">
      <label>中繼 server</label>
      <input type="url" id="srvUrl" placeholder="http://localhost:8000">
    </div>
    <div class="field">
      <label>金鑰</label>
      <input type="password" id="srvKey" placeholder="（可留空）">
    </div>
  </div>
  <div id="hint">選取特效後，點擊畫面任意位置發送。懸停圓形按鈕會顯示名稱為提示；［參數］展開目前特效參數，［連線設定］展開 server 與金鑰設定。點擊左上圓形按鈕可收合/展開面板，按住拖曳可移動位置。狀態僅記錄於 console。</div>
</div>
<script src="app.js"></script>
</body>
</html>
