<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>console — 控制端</title>
<style>
  html, body { margin: 0; height: 100%; background: #101418; overflow: hidden; font-family: system-ui, sans-serif; }
  #panel {
    position: fixed; left: 12px; top: 12px; z-index: 10;
    background: rgba(20, 26, 32, 0.92); color: #dfe7ee;
    border: 1px solid #2c3a46; border-radius: 10px; padding: 12px 14px;
    width: 260px; box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    user-select: none;
  }
  #panel h1 { font-size: 13px; margin: 0 0 10px; color: #8fb6d9; letter-spacing: 1px; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .fx {
    flex: 1 1 45%; padding: 7px 4px; font-size: 13px; text-align: center;
    background: #1b2530; color: #dfe7ee; border: 1px solid #33475a;
    border-radius: 6px; cursor: pointer;
  }
  .fx:hover { border-color: #4d6a86; }
  .fx.selected { background: #2d4a66; border-color: #6ea3d8; color: #fff; }
  #clearBtn {
    flex: 1 1 100%; padding: 7px; font-size: 13px;
    background: #3a2026; color: #ff9b9b; border: 1px solid #6e3a44;
    border-radius: 6px; cursor: pointer;
  }
  #clearBtn:hover { background: #4a2830; }
  .field { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 6px; }
  .field label { width: 52px; color: #8fa6b8; }
  .field input[type="color"] { width: 34px; height: 24px; border: none; background: none; padding: 0; cursor: pointer; }
  .field input[type="text"] { flex: 1; background: #101820; color: #dfe7ee; border: 1px solid #33475a; border-radius: 4px; padding: 4px 6px; font-size: 12px; }
  .field input[type="url"], .field input[type="password"] { flex: 1; background: #101820; color: #dfe7ee; border: 1px solid #33475a; border-radius: 4px; padding: 4px 6px; font-size: 11px; }
  #hint { font-size: 11px; color: #64798a; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>
<div id="panel">
  <h1>控制端 (console)</h1>
  <div class="row" id="fxButtons">
    <button class="fx selected" data-fx="particle">粒子爆散</button>
    <button class="fx" data-fx="ripple">漣漪圈</button>
    <button class="fx" data-fx="firework">煙火</button>
    <button class="fx" data-fx="text">浮現文字</button>
  </div>
  <div class="field">
    <label>顏色</label>
    <input type="color" id="color" value="#ff0044">
    <label>文字</label>
    <input type="text" id="text" value="Hello" placeholder="text 特效內容">
  </div>
  <div class="row">
    <button id="clearBtn">清屏</button>
  </div>
  <div class="field">
    <label>中繼 server</label>
    <input type="url" id="srvUrl" placeholder="http://localhost:8000">
  </div>
  <div class="field">
    <label>金鑰</label>
    <input type="password" id="srvKey" placeholder="（可留空）">
  </div>
  <div id="hint">選取特效後，點擊畫面任意位置發送。狀態僅記錄於 console。</div>
</div>
<script src="app.js"></script>
</body>
</html>
